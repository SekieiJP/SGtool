<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>クイズ＆タイマー</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* ベーススタイルとモバイル特有の挙動リセット */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f3f4f6; /* ライトテーマの背景色 */
            color: #1f2937; /* ライトテーマの基本文字色 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: manipulation; /* ダブルタップズームの無効化 */
            -webkit-tap-highlight-color: transparent; /* タップ時のハイライトを無効化 */
            user-select: none;
            -webkit-user-select: none;
        }

        /* セーフエリア（iPhoneのノッチやホームバー対応） */
        .safe-area-container {
            width: 100%;
            height: 100%;
            padding-top: env(safe-area-inset-top);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            box-sizing: border-box;
            display: flex;
        }

        /* スコア加算時のバウンスアニメーション */
        @keyframes bounce-score {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .animate-bounce-score {
            animation: bounce-score 0.2s ease-out;
        }
        
        /* お題のフォントサイズ自動調整用 */
        .text-fit-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            overflow: hidden;
            padding: 8px; /* 少しだけ余白を持たせる */
            box-sizing: border-box;
        }
        .text-fit-content {
            white-space: normal;
            text-align: center;
            width: 100%;
            word-break: keep-all; /* 単語の途中での改行を防ぐ */
            overflow-wrap: break-word;
            line-height: 1.1; /* 行間を詰めて大きく表示しやすくする */
        }
    </style>
</head>
<body ontouchstart="">
    <div class="safe-area-container">
        
        <!-- ==============================================
             左側エリア (80%) : お題 ＆ カウンター
        =============================================== -->
        <div class="w-[80%] h-full flex flex-col border-r border-gray-300">
            
            <!-- [上部 40%] 現在のお題 (タップで前へ) -->
            <div id="prev-btn" class="h-[40%] border-b border-gray-300 cursor-pointer active:bg-gray-200 transition-colors flex flex-col relative group">
                <div id="current-odai-container" class="text-fit-container">
                    <div id="current-odai-text" class="text-fit-content font-bold text-gray-900"></div>
                </div>
            </div>

            <!-- [中部 30%] 次のお題 (タップで次へ) -->
            <div id="next-btn" class="h-[30%] border-b border-gray-300 cursor-pointer active:bg-gray-200 transition-colors flex flex-col relative group">
                <div id="next-odai-container" class="text-fit-container">
                    <div id="next-odai-text" class="text-fit-content font-bold text-gray-400"></div>
                </div>
            </div>

            <!-- [下部 30%] カウンターエリア -->
            <div class="h-[30%] flex relative">
                <!-- チームスコア -->
                <div class="flex-1 flex bg-white">
                    <!-- チームA (赤) -->
                    <div id="team-0-btn" class="flex-1 border-r border-gray-300 flex flex-col items-center justify-center cursor-pointer active:bg-red-50 transition-colors">
                        <div id="team0-name" class="text-xs sm:text-sm font-bold text-red-600 mb-1">Aチーム</div>
                        <div id="team0-score" class="font-black text-red-600" style="font-size: min(8vw, 10vh);">0</div>
                    </div>
                    <!-- チームB (黄) -->
                    <div id="team-1-btn" class="flex-1 border-r border-gray-300 flex flex-col items-center justify-center cursor-pointer active:bg-yellow-50 transition-colors">
                        <div id="team1-name" class="text-xs sm:text-sm font-bold text-yellow-600 mb-1">Bチーム</div>
                        <div id="team1-score" class="font-black text-yellow-600" style="font-size: min(8vw, 10vh);">0</div>
                    </div>
                    <!-- チームC (青) -->
                    <div id="team-2-btn" class="flex-1 flex flex-col items-center justify-center cursor-pointer active:bg-blue-50 transition-colors">
                        <div id="team2-name" class="text-xs sm:text-sm font-bold text-blue-600 mb-1">Cチーム</div>
                        <div id="team2-score" class="font-black text-blue-600" style="font-size: min(8vw, 10vh);">0</div>
                    </div>
                </div>
                
                <!-- 操作ボタン群 (右端固定) -->
                <div class="w-16 sm:w-20 border-l border-gray-300 flex flex-col bg-gray-100">
                    <button id="undo-btn" class="flex-1 border-b border-gray-300 flex flex-col items-center justify-center active:bg-gray-300 transition-colors disabled:opacity-30 text-gray-500 hover:text-gray-900" disabled>
                        <i class="ph ph-arrow-u-up-left text-xl sm:text-2xl"></i>
                        <span class="text-[9px] mt-1">Undo</span>
                    </button>
                    <button id="settings-btn" class="flex-1 flex flex-col items-center justify-center active:bg-gray-300 transition-colors text-gray-500 hover:text-gray-900">
                        <i class="ph ph-gear text-xl sm:text-2xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- ==============================================
             右側エリア (20%) : タイマー
        =============================================== -->
        <div class="w-[20%] h-full flex flex-col bg-white border-l border-gray-200 shadow-[-2px_0_10px_rgba(0,0,0,0.05)] z-10">
            <div id="timer-area-btn" class="flex-1 flex flex-col items-center justify-center relative p-2 cursor-pointer active:bg-gray-50 transition-colors">
                <span class="absolute top-2 sm:top-4 text-[10px] sm:text-xs text-gray-400 font-bold tracking-widest uppercase">Timer</span>
                <!-- 動的文字サイズのタイマー表示 -->
                <div id="timer-display" class="font-mono font-black text-gray-800 text-center leading-none" style="font-size: min(8vw, 12vh);">120</div>
            </div>
            
            <div class="h-[30%] flex flex-col border-t border-gray-200">
                <button id="timer-toggle-btn" class="flex-1 border-b border-gray-200 active:bg-gray-100 transition-colors font-black text-sm sm:text-xl text-green-600 tracking-wider">START</button>
                <button id="timer-reset-btn" class="flex-1 active:bg-gray-100 transition-colors font-black text-sm sm:text-xl text-red-600 tracking-wider">RESET</button>
            </div>
        </div>
    </div>

    <!-- ==============================================
         設定モーダル
    =============================================== -->
    <div id="settings-modal" class="fixed inset-0 bg-gray-900/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white border border-gray-200 p-5 sm:p-6 rounded-2xl w-full max-w-sm text-gray-900 shadow-2xl">
            <h2 class="text-xl sm:text-2xl font-bold mb-4 sm:mb-6 text-center border-b border-gray-200 pb-2">設定</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs sm:text-sm text-gray-600 mb-1">タイマー開始秒数</label>
                    <input type="number" id="setting-timer" class="w-full bg-gray-50 border border-gray-300 p-2 sm:p-3 rounded-lg text-gray-900 text-base sm:text-lg font-mono outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200" value="120">
                </div>
                
                <div class="grid grid-cols-3 gap-2 sm:gap-3">
                    <div>
                        <label class="block text-[10px] sm:text-xs text-red-600 mb-1 text-center">Aチーム名</label>
                        <input type="text" id="setting-team1" class="w-full bg-white border border-red-200 p-2 rounded-lg text-gray-900 text-center text-xs sm:text-sm outline-none focus:border-red-500 focus:ring-2 focus:ring-red-200" value="Aチーム">
                    </div>
                    <div>
                        <label class="block text-[10px] sm:text-xs text-yellow-600 mb-1 text-center">Bチーム名</label>
                        <input type="text" id="setting-team2" class="w-full bg-white border border-yellow-200 p-2 rounded-lg text-gray-900 text-center text-xs sm:text-sm outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-200" value="Bチーム">
                    </div>
                    <div>
                        <label class="block text-[10px] sm:text-xs text-blue-600 mb-1 text-center">Cチーム名</label>
                        <input type="text" id="setting-team3" class="w-full bg-white border border-blue-200 p-2 rounded-lg text-gray-900 text-center text-xs sm:text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200" value="Cチーム">
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-2 sm:gap-3 mt-6 sm:mt-8">
                <button id="settings-cancel" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg font-bold transition-colors text-gray-800 text-sm sm:text-base">キャンセル</button>
                <button id="settings-save" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 rounded-lg font-bold transition-colors text-white text-sm sm:text-base">保存</button>
            </div>
        </div>
    </div>

    <!-- ==============================================
         JavaScript ロジック
    =============================================== -->
    <script>
        /* --- 1. データ定義 --- */
        const odaiList = [
            "空高くにあるもの", "夜、暗くなってから見えるもの", "「ね」から始まるもの", "遠足に持っていくもの", 
            "「あ」から始まるもの", "「ち」から始まるもの", "道で見かける交通に関係するもの", "鳴き声や音が聞こえるもの", 
            "「う」で終わるもの", "「し」で終わるもの", "学校で身につけるもの", "「ゆ」から始まるもの", 
            "「ば」から始まるもの", "「ふ」から始まるもの", "お家の中にある生活道具", "「さ」から始まるもの", 
            "「ね」で終わるもの", "畑で土の中から掘り出すもの", "甘いおやつ「お」から始まるもの", "「う」から始まるもの", 
            "「め」から始まるもの", "「は」から始まるもの", "勉強する時に使う道具", "「ぎ」で終わるもの", 
            "森の中にいそうなもの", "地面にある「水」に関係するもの", "「ま」で終わるもの", "雨が降った時に使う・見えるもの", 
            "「も」で終わるもの", "エンジンやハンドルがある乗り物", "「こ」で終わるもの", "公園にある遊具「す」から始まるもの", 
            "「ひ」から始まるもの", "「か」から始まるもの", "「と」から始まるもの", "「き」で終わるもの", 
            "空を飛ぶ生き物「ん」で終わるもの", "「み」から始まるもの", "お正月に回して遊ぶもの", "夏に食べたり見たりするもの", 
            "お弁当の中に入っていそうなもの", "動物園や牧場にいる生き物", "体の一部につけるもの", "足に履くもの手に持つもの「い」から始まるもの", 
            "「け」から始まるもの", "「り」で終わるもの", "「じ」から始まるもの", "寒い時に使う・現れるもの", 
            "木になる果物「た」から始まるもの", "「き」から始まるもの", "「ぼ」から始まるもの", "「く」から始まるもの", 
            "「ぎ」から始まるもの"
        ];

        /* --- 2. 状態管理 --- */
        // お題
        let currentOdaiIndex = 0;
        let isOdaiHidden = false; // お題非表示フラグ
        
        // タイマー
        let timerSettings = 120;
        let currentTimer = 120;
        let timerInterval = null;
        let isTimerRunning = false;

        // カウンター
        let scores = [0, 0, 0];
        let lastScores = null; // Undo用（直前1回分）

        /* --- 3. お題表示ロジック --- */
        function updateOdai() {
            const currentContainer = document.getElementById('current-odai-container');
            const currentText = document.getElementById('current-odai-text');
            const nextContainer = document.getElementById('next-odai-container');
            const nextText = document.getElementById('next-odai-text');

            if (isOdaiHidden) {
                currentText.textContent = "みんなで！ イラストかるた";
                nextText.textContent = "";
            } else {
                currentText.textContent = odaiList[currentOdaiIndex];
                
                // 次のお題（ループ処理）
                let nextIndex = (currentOdaiIndex + 1) % odaiList.length;
                nextText.textContent = odaiList[nextIndex];
            }

            // 枠に合わせて文字サイズを最大化
            fitText(currentContainer, currentText);
            if (!isOdaiHidden) {
                fitText(nextContainer, nextText);
            }
        }

        // 二分探索でコンテナに収まる最大フォントサイズを計算
        function fitText(container, textElement) {
            if(!container.clientWidth) return; // 未描画時はスキップ

            let min = 10;
            let max = 250; // 最大ピクセルを大幅に引き上げ
            let best = min;
            
            // パディング等を考慮した許容サイズ (枠いっぱいまで使うため 98% に拡大)
            const cw = container.clientWidth * 0.98;
            const ch = container.clientHeight * 0.98;

            textElement.style.width = '100%';
            
            for (let i = 0; i < 20; i++) {
                let mid = (min + max) / 2;
                textElement.style.fontSize = mid + 'px';
                
                // scrollHeight/Width で溢れていないか確認
                if (textElement.scrollHeight <= ch && textElement.scrollWidth <= cw) {
                    best = mid;
                    min = mid;
                } else {
                    max = mid;
                }
            }
            textElement.style.fontSize = best + 'px';
        }

        /* --- 4. カウンターロジック --- */
        function updateScoreUI(index) {
            document.getElementById(`team${index}-score`).textContent = scores[index];
        }

        function playBounceAnim(teamIndex) {
            const el = document.getElementById(`team${teamIndex}-score`);
            el.classList.remove('animate-bounce-score');
            void el.offsetWidth; // 強制リフロー (アニメーションリスタート用)
            el.classList.add('animate-bounce-score');
        }

        function enableUndo() {
            const btn = document.getElementById('undo-btn');
            btn.disabled = false;
            btn.classList.remove('opacity-20');
        }

        function disableUndo() {
            const btn = document.getElementById('undo-btn');
            btn.disabled = true;
            btn.classList.add('opacity-20');
            lastScores = null;
        }

        function addScore(teamIndex, amount) {
            lastScores = [...scores]; // 状態を保存
            enableUndo();
            
            scores[teamIndex] += amount;
            updateScoreUI(teamIndex);
            playBounceAnim(teamIndex);
        }

        function undoScore() {
            if(!lastScores) return;
            scores = [...lastScores]; // 直前の状態に復元
            for(let i=0; i<3; i++) {
                updateScoreUI(i);
            }
            disableUndo(); // 1回戻したら無効化
        }

        /* --- 5. タイマーロジック --- */
        function updateTimerUI() {
            document.getElementById('timer-display').textContent = currentTimer.toString();
        }

        function setTimerUIState(isRunning) {
            const btn = document.getElementById('timer-toggle-btn');
            if(isRunning) {
                btn.textContent = "PAUSE";
                btn.classList.replace('text-green-600', 'text-yellow-600');
            } else {
                btn.textContent = "START";
                btn.classList.replace('text-yellow-600', 'text-green-600');
            }
        }

        function toggleTimer() {
            if(isTimerRunning) {
                // 一時停止
                clearInterval(timerInterval);
                isTimerRunning = false;
                setTimerUIState(false);
            } else {
                // 開始
                if(currentTimer <= 0) return;
                isTimerRunning = true;
                setTimerUIState(true);
                
                timerInterval = setInterval(() => {
                    currentTimer--;
                    updateTimerUI();
                    if(currentTimer <= 0) {
                        clearInterval(timerInterval);
                        isTimerRunning = false;
                        setTimerUIState(false);
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            currentTimer = timerSettings;
            updateTimerUI();
            setTimerUIState(false);
        }

        /* --- 6. 設定モーダルロジック --- */
        function saveSettings() {
            // タイマー設定の適用
            const newTimer = parseInt(document.getElementById('setting-timer').value, 10);
            if(!isNaN(newTimer) && newTimer > 0) {
                timerSettings = newTimer;
                resetTimer(); // 秒数を変更した場合はタイマーをリセット
            }
            
            // チーム名の適用
            document.getElementById('team0-name').textContent = document.getElementById('setting-team1').value || "Aチーム";
            document.getElementById('team1-name').textContent = document.getElementById('setting-team2').value || "Bチーム";
            document.getElementById('team2-name').textContent = document.getElementById('setting-team3').value || "Cチーム";
            
            closeSettings();
        }

        function openSettings() {
            const modal = document.getElementById('settings-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeSettings() {
            const modal = document.getElementById('settings-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        /* --- 7. 初期化とイベントバインド --- */
        document.addEventListener('DOMContentLoaded', () => {
            
            // レイアウト計算のための微小ディレイ
            setTimeout(() => {
                updateOdai();
                updateTimerUI();
            }, 50);

            // お題操作 (ループ対応)
            document.getElementById('next-btn').addEventListener('click', () => {
                currentOdaiIndex = (currentOdaiIndex + 1) % odaiList.length;
                updateOdai();
            });
            document.getElementById('prev-btn').addEventListener('click', () => {
                currentOdaiIndex = (currentOdaiIndex - 1 + odaiList.length) % odaiList.length;
                updateOdai();
            });

            // チーム個別加算
            for(let i=0; i<3; i++) {
                document.getElementById(`team-${i}-btn`).addEventListener('click', () => {
                    addScore(i, 1);
                });
            }

            // 全体操作ボタン
            document.getElementById('undo-btn').addEventListener('click', undoScore);
            document.getElementById('settings-btn').addEventListener('click', openSettings);

            // タイマーエリアタップでお題表示トグル
            document.getElementById('timer-area-btn').addEventListener('click', () => {
                isOdaiHidden = !isOdaiHidden;
                updateOdai();
            });

            // タイマーボタン
            document.getElementById('timer-toggle-btn').addEventListener('click', toggleTimer);
            document.getElementById('timer-reset-btn').addEventListener('click', resetTimer);

            // 設定モーダル内ボタン
            document.getElementById('settings-cancel').addEventListener('click', closeSettings);
            document.getElementById('settings-save').addEventListener('click', saveSettings);

            // 画面リサイズ時のお題文字サイズ再計算
            window.addEventListener('resize', () => {
                updateOdai();
            });
        });
    </script>
</body>
</html>
